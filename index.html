<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#500cbd" />

    <!-- Favicon and Apple Touch Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#500cbd" />

    <!-- App Info -->
    <meta name="apple-mobile-web-app-title" content="audioplotter" />
    <meta name="application-name" content="audioplotter" />
    <meta name="msapplication-TileColor" content="#500cbd" />

    <!-- SEO -->
    <meta name="description" content="Create graphics for penplotters from audio files. Visualize waveforms as downloadable SVGs." />
    <link rel="canonical" href="https://audioplotter.ars.is" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://audioplotter.ars.is" />
    <meta property="og:title" content="audioplotter" />
    <meta property="og:description" content="Create graphics for penplotters from audio files. Visualize waveforms as downloadable SVGs." />
    <meta property="og:image" content="https://audioplotter.ars.is/icons/android-chrome-512x512.png" />
    <meta name="twitter:card" content="summary" />

    <title>audioplotter</title>

    <!-- Dark mode detection (must run before body renders) -->
    <script>
      (function() {
        const theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-bs-theme', theme);
      })();
    </script>
  </head>
  <body>
    <noscript>
      <style>
        .noscript-fallback {
          font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
          max-width: 600px;
          margin: 4rem auto;
          padding: 2rem;
          text-align: center;
          color: #333;
        }
        @media (prefers-color-scheme: dark) {
          .noscript-fallback { color: #e0e0e0; }
        }
        .noscript-fallback h1 {
          color: #500cbd;
          font-size: 2rem;
          margin-bottom: 1rem;
        }
        .noscript-fallback p {
          line-height: 1.6;
          margin-bottom: 1.5rem;
        }
        .noscript-fallback a { color: #500cbd; }
        .noscript-fallback ul {
          list-style: none;
          padding: 0;
        }
        .noscript-fallback li { margin: 0.5rem 0; }
      </style>
      <div class="noscript-fallback">
        <h1>audioplotter</h1>
        <p>Create graphics for penplotters from audio files. Visualize waveforms as downloadable SVGs.</p>
        <p><strong>JavaScript is required</strong> to use this app. It uses the Web Audio API to analyze audio files in your browser.</p>
        <ul>
          <li><a href="https://github.com/eins78/audioplotter#readme">Documentation</a></li>
          <li><a href="https://github.com/eins78/audioplotter">Source Code</a></li>
        </ul>
      </div>
    </noscript>
    <div id="root">
      <div style="display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:#500cbd;">
        Loading audioplotter…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
